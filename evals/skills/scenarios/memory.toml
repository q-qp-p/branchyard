# Memory as a skill (docs/memory.md, M1): each scenario is a task a person gave after correcting the same
# mistake once, and the memory a person wrote from that correction, as the bundle writer produces it
# (`by memory add`, then `by memory export`). A team scenario seeds every team bundle under .agents/skills/
# through `files`, as a repository holds them, and the runner trusts the set before `by run`; the personal one
# seeds the private HOME's ~/.config/branchyard/skills/ through `home_files`. The expected id is the
# memory's reference, not the bundle: a turn that searches lands on the one memory and opens that file. A
# prompt never names the skill.

