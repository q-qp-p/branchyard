# Ask for a second reviewer on a database migration

A pull request that adds or changes a database migration gets two reviewers, one of them from the data team, before it is marked ready. Say so in the pull request body and request the review there; a migration merged with one review has been rolled back twice this year.

Approved by eval on 2026-11-07.

'''
