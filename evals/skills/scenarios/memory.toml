# Cut a release with the release script, then tag

A release is cut with `python3 tools/release.py VERSION`, which bumps every crate's version, moves the changelog's Unreleased section under the version with today's date, and regenerates the documentation facts. Commit what it rewrote as `Release VERSION`, then tag `vVERSION` on that commit.

Editing the versions or the changelog by hand leaves one of them behind, and the release check refuses the tag.

Approved by eval on 2026-11-07.

'''

