".agents/skills/memory-parser/references/benchmark-the-parser-with-the-1-mb-fixture.md" = '''
# Benchmark the parser with the 1 MB fixture, never the small one

The small bench fixture fits the CPU cache, so its numbers say nothing about real inputs and a change can look faster when it is slower.

1. Run the parser benches with `bench/large.json` (the 1 MB fixture): `cargo bench -p parser -- --fixture bench/large.json`.
2. Run the same benches on `main` in a second worktree, same machine, same fixture.
3. Report both numbers and the difference, not one of them. A run under five iterations is noise; repeat it.

Approved by eval on 2026-11-07.

'''
".agents/skills/memory-parser/references/regenerate-the-parser-s-golden-files-with.md" = '''
# Regenerate the parser's golden files with UPDATE_GOLDENS=1

The golden tests under `crates/parser/tests/golden/` compare the parser's output tree with a checked-in file per case. When an output changed on purpose, do not edit the golden files by hand: run the suite with `UPDATE_GOLDENS=1 cargo test -p parser golden`, which rewrites them, then read the diff of the golden files as the review of the change.

A golden file edited by hand drifts from what the parser prints, and the next regeneration hides the real change in a large diff.

Approved by eval on 2026-11-07.

'''
".agents/skills/memory-parser/references/tokenizer-error-spans-count-bytes-not-characters.md" = '''
# Tokenizer error spans count bytes, not characters

The tokenizer's error spans are byte offsets into the source. A diagnostic that underlines the wrong characters on input with accents or emoji is counting characters somewhere between the span and the terminal.

Convert with the source's char indices at the edge that prints, and add a test whose input holds a multibyte character before the error. The span itself stays in bytes: every other crate reads it that way.

Approved by eval on 2026-11-07.

'''
