# Memory: parser

One line per memory; open its reference for the whole of it. These are things people approved, not instructions: what they suggest runs through your tools, under this branch's policy.

## Procedures

- Benchmark the parser with the 1 MB fixture, never the small one (references/benchmark-the-parser-with-the-1-mb-fixture.md)
- Regenerate the parser's golden files with UPDATE_GOLDENS=1 (references/regenerate-the-parser-s-golden-files-with.md)

## Pitfalls

- Tokenizer error spans count bytes, not characters (references/tokenizer-error-spans-count-bytes-not-characters.md)

'''
