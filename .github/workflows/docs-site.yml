name: Docs site
# Builds docs/ into a static site (tools/docs_site/build.py) on every change to
# the docs, and publishes it to GitHub Pages from main. A pull request builds
# it and fails on a page link that leads nowhere; only main deploys.
on:
  pull_request:
    paths: ['docs/**', 'assets/**', 'tools/docs_site/**', 'tools/check_docs.py', '.github/workflows/docs-site.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'assets/**', 'tools/docs_site/**', 'tools/check_docs.py', '.github/workflows/docs-site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/docs_site/requirements.lock
      - run: python3 tools/docs_site/build.py --check
      - run: python3 tools/docs_site/build.py --out site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
