[package]
name = "branchyard-container"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Owned container sandboxes with explicit runtime and resource boundaries"

[lints]
workspace = true

[features]
schema = ["dep:schemars"]

[dependencies]
blake3 = { workspace = true }
branchyard-sandbox = { path = "../branchyard-sandbox" }
branchyard-support = { path = "../branchyard-support" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
branchyard-testkit = { path = "../branchyard-testkit" }
